<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#14161c" />
    <title>ドミソ音感トレーナー</title>
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <main id="setup" class="screen">
      <h1>ドミソ音感トレーナー</h1>

      <section>
        <h2>声域</h2>
        <div class="seg" id="voice"></div>
      </section>

      <section>
        <h2>モード</h2>
        <div class="modes" id="mode"></div>
      </section>

      <section>
        <h2>判定</h2>
        <div class="seg" id="tolerance"></div>
      </section>

      <section>
        <h2>キープ時間</h2>
        <div class="seg" id="holdMs"></div>
      </section>

      <section>
        <h2>回数（コード数）</h2>
        <div class="seg" id="rounds"></div>
      </section>

      <section class="toggles">
        <label><input type="checkbox" id="slide" /> スライド（声を切らずに次の音へ一発で移る）</label>
        <label><input type="checkbox" id="headphones" /> イヤホンを使う（有線推奨）</label>
        <label><input type="checkbox" id="speech" /> 評価を読み上げる</label>
        <label><input type="checkbox" id="octaveFree" /> オクターブ違いもOK</label>
      </section>

      <p class="hint" id="hint"></p>
      <button id="start" class="primary">スタート</button>
      <button id="openTuner" class="secondary">チューナー</button>
      <button id="openKaraoke" class="secondary">カラオケ</button>
      <p class="error" id="error"></p>
    </main>

    <main id="practice" class="screen" hidden>
      <header class="status">
        <span id="modeLabel"></span>
        <span id="aidLabel"></span>
        <span id="score"></span>
      </header>
      <div class="chord" id="chord"></div>
      <div class="steps" id="steps"></div>
      <div class="message" id="message"></div>
      <div class="meter">
        <div class="zone" id="zone"></div>
        <div class="center"></div>
        <div class="needle" id="needle"></div>
        <span class="flat">♭</span><span class="sharp">♯</span>
      </div>
      <canvas id="graph"></canvas>
      <button id="stop">やめる</button>
    </main>

    <main id="tuner" class="screen" hidden>
      <div class="tuner-note">
        <div id="tunerNote">–</div>
        <div id="tunerCents" class="tuner-cents"></div>
      </div>
      <div class="meter">
        <div class="zone" id="tunerZone"></div>
        <div class="center"></div>
        <div class="needle" id="tunerNeedle"></div>
        <span class="flat">♭</span><span class="sharp">♯</span>
      </div>
      <canvas id="tunerGraph" class="tall"></canvas>
      <button id="closeTuner">もどる</button>
    </main>

    <main id="karaokeSetup" class="screen" hidden>
      <h1>カラオケ</h1>
      <p class="hint">
        声だけの音声（先生の手本の録音、アカペラなど）を1つ選ぶと、音程のバーを作って一緒に歌えます。
        CLI で作ったデータは、.domiso.json と音声ファイルをまとめて選びます。
      </p>

      <label class="file-btn">
        <input type="file" id="kFiles" multiple accept="audio/*,.m4a,.mp3,.wav,.aac,.ogg,.json,application/json" hidden />
        ファイルを開く
      </label>
      <p class="kstatus" id="kStatus"></p>

      <section class="toggles">
        <h2>流す音</h2>
        <label><input type="checkbox" id="playInst" /> 伴奏</label>
        <label><input type="checkbox" id="playVoice" /> お手本の声</label>
        <label><input type="checkbox" id="playMelody" /> ガイドメロディ</label>
        <label><input type="checkbox" id="playOriginal" /> 原曲（伴奏と声の代わりに聴く）</label>
      </section>
      <section>
        <h2>オクターブ</h2>
        <div class="seg" id="octave"></div>
      </section>
      <section>
        <h2>判定</h2>
        <div class="seg" id="kTolerance"></div>
      </section>
      <section>
        <h2>遅延補正 <span id="latencyLabel"></span></h2>
        <input type="range" id="latency" min="-100" max="300" step="10" />
        <p class="hint">自分の線がバーより右（遅れ）にずれるなら増やします。Bluetooth イヤホンでは 150〜250ms 程度。</p>
      </section>
      <section class="toggles">
        <label><input type="checkbox" id="showContour" /> お手本の細かい音程の線を表示</label>
        <label><input type="checkbox" id="kOctaveFree" /> オクターブ違いもOK</label>
      </section>

      <button id="kSing" class="primary" disabled>歌う</button>
      <button id="kSave" class="secondary" disabled>解析データを保存</button>
      <button id="kGuideAudio" class="secondary" disabled>ガイドメロディを保存（音声）</button>
      <button id="kMidi" class="secondary" disabled>ガイドメロディを保存（MIDI）</button>
      <button id="kBack" class="secondary">もどる</button>
      <p class="error" id="kError"></p>
    </main>

    <main id="karaoke" class="screen" hidden>
      <header class="status">
        <span id="kTitle"></span>
        <span id="kTime"></span>
      </header>
      <div class="tuner-note">
        <div id="kNote" class="idle">–</div>
        <div id="kCents" class="tuner-cents"></div>
      </div>
      <canvas id="kGraph" class="tall"></canvas>
      <div class="message" id="kResult"></div>
      <div class="speed">
        <button id="kSlower">遅く</button>
        <button id="kSpeed" title="タップで等速に戻す">1.00倍</button>
        <button id="kFaster">速く</button>
      </div>
      <div class="controls">
        <button id="kRewind">⏪ 5秒</button>
        <button id="kPlay" class="primary">一時停止</button>
        <button id="kStop">やめる</button>
      </div>
    </main>

    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
